[package]
name = "multicad-foundation-lab"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
multicad-ui = { path = "../../../crates/multicad-ui" }
multicad-kernel-proof = { path = "../kernel" }
eframe = { version = "=0.36.2", default-features = false, features = ["wgpu", "default_fonts", "accesskit", "wayland", "x11"] }
egui_dock = "=0.21.1"
sketch-solver = "=0.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
