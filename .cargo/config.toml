[build]
# Keep Rust products separate from the retained target/native OCCT cache and
# the historical target/debug directory. CARGO_TARGET_DIR still overrides it.
target-dir = "target/cargo"

# Avoid requiring a separately installed Visual C++ runtime in Windows archives.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
[env]
# Explicit back-deployment floor; do not inherit the developer's SDK version.
MACOSX_DEPLOYMENT_TARGET = { value = "13.0", force = false }

