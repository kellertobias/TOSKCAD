[package]
name = "multicad-ui"
description = "Native application host; domain workspaces register separately"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
eframe.workspace = true
multicad-core.workspace = true
multicad-solver.workspace = true
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }

[target.'cfg(target_os = "macos")'.dependencies]
cxx = "=1.0.205"
raw-window-handle = "=0.6.2"

[build-dependencies]
cxx-build = "=1.0.205"

[dev-dependencies]
multicad-kernel.workspace = true
multicad-model.workspace = true
naga = { version = "=30.0.1", features = ["wgsl-in"] }

# Only the small audited native-window bridge may declare unsafe FFI.
[lints.rust]
unsafe_code = "deny"
[lints.clippy]
all = "warn"
