[package]
name = "multicad-app"
description = "Native MultiCAD application entry point"
default-run = "multicad"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "multicad"
path = "src/main.rs"

[features]
default = ["occt"]
occt = ["multicad-kernel/occt", "multicad-model/occt", "multicad-mcp/occt"]

[dependencies]
multicad-core.workspace = true
multicad-kernel.workspace = true
multicad-solver.workspace = true
multicad-model.workspace = true
multicad-ui.workspace = true
multicad-mcp.workspace = true
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
tempfile = "=3.27.0"
rfd = "=0.16.0"
pollster = "=0.4.0"

[dev-dependencies]
tempfile = "=3.27.0"
dxf = "=0.6.2"

[target.'cfg(windows)'.build-dependencies]
winresource = { version = "=0.1.31", default-features = false }

[lints]
workspace = true
