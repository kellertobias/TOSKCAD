[package]
name = "multicad-core"
description = "Canonical MultiCAD document and dependency graph, independent of UI/kernel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
multicad-precision.workspace = true
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
uuid = { version = "=1.29.0", features = ["v4", "serde"] }
sha2 = "=0.10.9"
quick-xml = "=0.41.0"
# Sketch text: glyph outlines from the font bundled in the binary.
skrifa = { version = "=0.44.0", default-features = false, features = ["std"] }
epaint_default_fonts = "=0.36.2"

[dev-dependencies]
tempfile = "=3.27.0"

[lints]
workspace = true
