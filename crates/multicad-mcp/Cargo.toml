[package]
name = "multicad-mcp"
description = "Local Model Context Protocol server over the shared MultiCAD command API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
multicad-core.workspace = true
multicad-kernel.workspace = true
multicad-solver.workspace = true
multicad-model.workspace = true
rmcp = { version = "=3.8.0", default-features = false, features = ["server", "transport-io"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
schemars = "=1.2.3"
tokio = { version = "=1.54.1", features = ["rt", "rt-multi-thread", "net"] }

[target.'cfg(unix)'.dependencies]
tempfile = "=3.27.0"

[dev-dependencies]
tempfile = "=3.27.0"

[lints]
workspace = true
