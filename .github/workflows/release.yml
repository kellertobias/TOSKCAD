name: CI and release

# Forgejo owns branches. Its push mirror sends commits to GitHub. Only GitHub
# mints release tags on the exact tested commit; no release branch commits.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: multicad-ci-${{ github.ref }}
  # Never interrupt an active main release halfway through tag/asset publication.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  foundation:
    name: Native dependency proof
    uses: ./.github/workflows/native-foundation.yml

  regression:
    name: Native regression suites
    uses: ./.github/workflows/native-regression.yml

  metadata:
    name: Select build/release version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Preview semantic version without remote writes
        id: version
        run: node tools/select-version.mjs

  quality:
    name: Formatting, Clippy and release contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: rustup show active-toolchain
      - run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev
      - run: node tools/foundation-deps.mjs
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: npm test
      - run: node mockup/verify.mjs

  build:
    name: Build and test / ${{ matrix.target }}
    needs: metadata
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64
          - os: macos-15
            target: macos-arm64
          - os: windows-2025
            target: windows-x64
    env:
      MULTICAD_RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: rustup show active-toolchain
      - name: Linux native window development libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev
      - name: Test, build, smoke-check and archive the exact version
        run: node tools/package-release.mjs build "$env:MULTICAD_RELEASE_VERSION"
        if: runner.os == 'Windows'
      - name: Test, build, smoke-check and archive the exact version
        run: node tools/package-release.mjs build "$MULTICAD_RELEASE_VERSION"
        if: runner.os != 'Windows'
      - name: Preserve verified platform archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}-${{ github.sha }}
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Mint GitHub tag and hosted release
    needs: [metadata, quality, build, foundation, regression]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.metadata.outputs.release == 'true' &&
      vars.MULTICAD_RELEASES_ENABLED == 'true' &&
      vars.FORGEJO_TAG_RECONCILIATION_VERIFIED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: multicad-semantic-release-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*-${{ github.sha }}
          path: artifacts/release
          merge-multiple: true
      - name: Verify every archive, identity and checksum
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: node tools/package-release.mjs verify "$VERSION" "$GITHUB_SHA"
      - name: Create tag-only release on the tested mirrored commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          MULTICAD_RELEASES_ENABLED: ${{ vars.MULTICAD_RELEASES_ENABLED }}
          FORGEJO_TAG_RECONCILIATION_VERIFIED: ${{ vars.FORGEJO_TAG_RECONCILIATION_VERIFIED }}
          MULTICAD_EXPECTED_RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: npm run release
      - name: Verify the tag and unchanged tracked files
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          test "$(git rev-parse "v$VERSION^{commit}")" = "$GITHUB_SHA"
          git diff --exit-code
