name: Bootstrap CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bootstrap-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Rust bootstrap / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            binary: multicad
          - os: macos-15
            binary: multicad
          - os: windows-2025
            binary: multicad.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select repository toolchain
        # Rustup reads rust-toolchain.toml and installs its pinned toolchain/components.
        run: rustup show active-toolchain

      - name: Report compiler versions
        run: |
          rustc --version --verbose
          cargo --version

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint all targets
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run native tests
        run: cargo test --workspace --locked

      - name: Build release bootstrap
        run: cargo build --workspace --release --locked

      - name: Smoke-test diagnostics
        run: cargo run --release --locked -- --diagnostics

      - name: Retain bootstrap executable and license
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: multicad-bootstrap-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/release/${{ matrix.binary }}
            LICENSE
            docs/BUILDING.md
          if-no-files-found: error
          retention-days: 7
