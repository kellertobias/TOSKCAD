[workspace]
members = ["crates/multicad-core", "crates/multicad-app", "crates/multicad-native-build", "crates/multicad-kernel", "crates/multicad-solver", "crates/multicad-model", "crates/multicad-ui", "crates/multicad-mcp"]
default-members = ["crates/multicad-app"]
resolver = "3"
exclude = ["spikes/native-foundation"]

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.99.1"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
multicad-core = { path = "crates/multicad-core" }
multicad-kernel = { path = "crates/multicad-kernel" }
multicad-solver = { path = "crates/multicad-solver" }
multicad-model = { path = "crates/multicad-model" }
multicad-ui = { path = "crates/multicad-ui" }
multicad-mcp = { path = "crates/multicad-mcp" }
multicad-native-build = { path = "crates/multicad-native-build" }
eframe = { version = "=0.36.2", default-features = false, features = ["wgpu", "default_fonts", "accesskit", "wayland", "x11"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Native example regeneration is expensive without Rust optimization.
# Keep development assertions while avoiding release LTO for test binaries.
[profile.ci]
inherits = "dev"
opt-level = 2
debug = 0
debug-assertions = true
overflow-checks = true
codegen-units = 16
incremental = false
